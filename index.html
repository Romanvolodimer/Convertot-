<!doctype html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV → Hourly Excel Converter</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <section class="card">
      <div class="badge">CSV → XLSX</div>
      <h1>Конвертер 30 хв → 1 година</h1>
      <p class="subtitle">Завантаж CSV-файл, і сервіс об'єднає кожні два 30-хвилинні значення в один погодинний запис.
      </p>

      <label class="dropzone" id="dropzone" for="fileInput">
        <input id="fileInput" type="file" accept=".csv,text/csv">
        <div class="drop-icon">↑</div>
        <strong>Вибрати CSV-файл</strong>
        <span>або перетягни файл сюди</span>
      </label>

      <div id="fileInfo" class="file-info hidden"></div>
      <div id="status" class="status hidden"></div>

      <div id="summary" class="summary hidden">
        <div><span>30-хв. записів</span><strong id="inputCount">0</strong></div>
        <div><span>Погодинних записів</span><strong id="outputCount">0</strong></div>
        <div><span>Дат</span><strong id="dateCount">0</strong></div>
      </div>

      <div class="actions">
        <button id="convertBtn" class="primary" disabled>Конвертувати та скачати XLSX</button>
        <button id="resetBtn" class="secondary" disabled>Очистити</button>
      </div>

      <div id="previewWrap" class="preview hidden">
        <h2>Попередній перегляд</h2>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Дата</th>
                <th>Час</th>
                <th>Обсяг</th>
              </tr>
            </thead>
            <tbody id="previewBody"></tbody>
          </table>
        </div>
      </div>


    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
